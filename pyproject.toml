[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pacta-escrow"
version = "2026.1.0"
description = "x402 / AP2 Machine-Customer Escrow & Autonomous Arbitration Rail for the Agent Economy"
authors = [
    { name = "Pacta Core Team", email = "dev@pacta.network" }
]
license = { text = "Apache-2.0" }
readme = "PROJE_KAGIDI.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "web3>=6.0.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
pacta = "pacta.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --strict-markers"

[tool.setuptools]
packages = ["pacta"]

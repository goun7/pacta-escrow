name: Pacta CI / CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite with Coverage
        run: |
          pytest -v --cov=pacta --cov-report=term-missing --cov-fail-under=95

      - name: Verify Solvency Invariant via CLI
        run: |
          python -m pacta.cli status
          python -m pacta.cli demo

      - name: Dry-Run Contract Deployment Script
        run: |
          python scripts/deploy_vault.py
